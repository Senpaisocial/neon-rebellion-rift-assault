name: Repair game assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Make generator compatible with current build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_safe_assets.py')
          s=p.read_text()
          s=s.replace("r'const MANIFEST=(\\{.*?\\});\\s*const A='", "r'const MANIFEST=(\\{.*?\\});'")
          p.write_text(s)
          PY
      - name: Generate safe production atlas and Neon Jungle background
        run: python tools/build_safe_assets.py
      - name: Point game to generated safe assets
        run: |
          sed -i "s#assets/atlas.avif#assets/atlas-safe.png#g" index.html
          sed -i "s#assets/neon-jungle.avif#assets/neon-jungle-safe.webp#g" index.html
      - name: Validate generated files
        run: |
          test -s assets/atlas-safe.png
          test -s assets/neon-jungle-safe.webp
          grep -q 'assets/atlas-safe.png' index.html
      - name: Commit repaired assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/atlas-safe.png assets/neon-jungle-safe.webp index.html
          git commit -m 'Generate visible production game assets' || exit 0
          git push
